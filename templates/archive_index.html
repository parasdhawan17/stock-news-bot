<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock News Archives</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: #eef1f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #1a1a2e;
      line-height: 1.5;
    }
    .container { max-width: 640px; margin: 0 auto; }
    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
    }
    .header {
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 100%);
      padding: 32px 28px;
      text-align: center;
      color: #fff;
    }
    .header h1 { margin: 0 0 8px; font-size: 26px; }
    .header p { margin: 0; font-size: 14px; color: #cbd5e1; }
    .header a { color: #93c5fd; text-decoration: none; }
    .header a:hover { text-decoration: underline; }
    .content { padding: 24px 28px; }
    .archive-list { list-style: none; margin: 0; padding: 0; }
    .archive-list li {
      border-bottom: 1px solid #e8ecf0;
      padding: 14px 0;
    }
    .archive-list li:last-child { border-bottom: none; }
    .archive-list a {
      color: #1d4ed8;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
    }
    .archive-list a:hover { text-decoration: underline; }
    .empty {
      color: #718096;
      font-style: italic;
      text-align: center;
      padding: 24px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <header class="header">
        <h1>Stock News Archives</h1>
        <p>
          {% if site_url %}
          <a href="{{ site_url }}/">Back to latest digest</a>
          {% else %}
          Past digests
          {% endif %}
        </p>
      </header>
      <div class="content">
        {% if archives %}
        <ul class="archive-list">
          {% for entry in archives %}
          <li>
            <a href="{{ entry.filename }}">{{ entry.label }}</a>
          </li>
          {% endfor %}
        </ul>
        {% else %}
        <p class="empty">No archived digests yet.</p>
        {% endif %}
      </div>
    </div>
  </div>
</body>
</html>
